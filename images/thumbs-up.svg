<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="140" height="140" fill="none">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f2ff"/>
      <stop offset="100%" stop-color="#dce1fa"/>
    </linearGradient>

    <!-- Hand Gradient (Vibrant Blue & Brand Indigo) -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b42b6"/>
      <stop offset="100%" stop-color="#2d2d86"/>
    </linearGradient>

    <!-- Gold Accent for Stars & Cuff -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2d2d86" flood-opacity="0.22"/>
    </filter>
    <filter id="popShadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2d2d86" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Glowing Circle -->
  <circle cx="80" cy="80" r="72" fill="url(#bgGrad)" filter="url(#shadowGlow)"/>
  <circle cx="80" cy="80" r="62" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

  <!-- Decorative Sparkles / Stars -->
  <path d="M125 32L128 40L136 43L128 46L125 54L122 46L114 43L122 40Z" fill="url(#goldGrad)"/>
  <path d="M30 45L32 50L37 52L32 54L30 59L28 54L23 52L28 50Z" fill="url(#goldGrad)"/>
  <path d="M132 98L133.5 102L137.5 103.5L133.5 105L132 109L130.5 105L126.5 103.5L130.5 102Z" fill="url(#goldGrad)"/>

  <!-- Thumbs Up Hand Shape -->
  <g filter="url(#popShadow)">
    <!-- Sleeve / Cuff -->
    <rect x="42" y="94" width="22" height="34" rx="6" fill="url(#goldGrad)"/>
    <rect x="48" y="92" width="10" height="38" rx="3" fill="#ffffff" opacity="0.3"/>

    <!-- Wrist & Palm & Thumb -->
    <!-- Thumb Up -->
    <path d="M78 44C78 38 82 30 89 30C95 30 98 35 98 42C98 52 93 64 93 68L112 68C117 68 121 72 121 77C121 79.5 119.5 82 117.5 83.5C120 85.5 120.5 89 119.5 92C121 94.5 120.5 98 118 100.5C119 102.5 118.5 105.5 116.5 107.5C114.5 109.5 111 110 108 110L78 110C71 110 64 105 64 98L64 78C64 71 71 63 75 58L78 44Z" 
          fill="url(#handGrad)"/>

    <!-- Finger Knuckle Lines -->
    <path d="M96 79L115 79" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M95 89L114 89" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M94 99L112 99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Thumb Highlight Accent -->
    <path d="M84 42C84 39 86 35 90 35C93 35 94 37 94 42C94 51 89.5 61 88 66" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
